name: Feature request
description: Suggest a product or developer-experience improvement.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Features must support the school-environment goal without exposing identities.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy/safety impact
